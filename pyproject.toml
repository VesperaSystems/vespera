[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vespera"
version = "0.4.0"
description = "Local-first AI deal analysis and due diligence. Read a dataroom, cross-check its claims, score it against your thesis — without documents leaving your machine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Vespera Systems" }]
keywords = ["due-diligence", "dataroom", "local-first", "llm", "ollama", "contracts", "m&a"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/VesperaSystems/vespera"
Repository = "https://github.com/VesperaSystems/vespera"
Issues = "https://github.com/VesperaSystems/vespera/issues"

[project.scripts]
vespera = "vespera.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vespera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
